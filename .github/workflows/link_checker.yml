name: Discord 404 checker (cron + manual test)

on:
  schedule:
    # Runs every 15 minutes (UTC). Change as needed.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (none for this script)
        run: python -m pip install --upgrade pip

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          USER_ID: ${{ secrets.USER_ID }}
        run: |
          python -u scripts/link_checker.py
